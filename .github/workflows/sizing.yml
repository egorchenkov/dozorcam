# Замер ресурсов движка на amd64-раннере GitHub (scripts/sizing-bench.sh): цифры для
# калькулятора железа на сайте. Только вручную: Actions → sizing → Run workflow.
name: sizing

on:
  workflow_dispatch:
    inputs:
      image:
        description: "engine image"
        default: "ghcr.io/egorchenkov/dozorcam:latest"

permissions:
  contents: read

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: lscpu | sed -n '1,20p'; free -m; docker version --format '{{.Server.Version}}'
      - run: docker pull -q "${{ inputs.image }}"
      # Как установка из чата: лимит 200 МБ на поток, детектор на основном потоке (substream 0);
      # камер, сцена, ядер, substream: тихо 1/4/8, движение 1/4, для сравнения 8 на детекторном.
      - run: |
          for spec in "1 quiet 2 0" "4 quiet 2 0" "8 quiet 2 0" "1 busy 2 0" "4 busy 2 0" "8 quiet 2 1"; do
            set -- $spec
            CCTV_BENCH_STREAM_CAP_MB=200 CCTV_BENCH_SUBSTREAM="$4" \
              scripts/sizing-bench.sh -n "$1" -s "$2" -c "$3" -m 6g -w 60 -d 120 \
              -i "${{ inputs.image }}" -o sizing.jsonl | tail -1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sizing-amd64
          path: sizing.jsonl
