# Сайт проекта: статический docs/site → GitHub Pages (egorchenkov.github.io/dozorcam).
# Один раз в настройках репозитория: Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [master]
    paths: ["docs/site/**", "scripts/install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # curl -fsSL https://<owner>.github.io/dozorcam/install.sh | sh — тот же файл,
      # что в релизе (sha256 в SHA256SUMS релиза).
      - run: install -m 0644 scripts/install.sh docs/site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
