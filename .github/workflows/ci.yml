# Тесты на каждый PR и push в master; плюс gitleaks по дереву.
name: ci

on:
  pull_request:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Контрактные тесты моста гоняют настоящий ffmpeg/openssl/curl.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      # Отдельным шагом, чтобы провал был виден по имени: паритет каталогов en/ru и
      # гейт «русский текст для человека — только в cctv/i18n/locales».
      - name: i18n gate (en/ru parity, no Russian literals outside locales)
        run: python -m pytest -q tests/test_i18n.py tests/test_i18n_literals.py
      - run: python -m pytest -q
      # Сайт (docs/site) и оба README говорят версию релиза (cctv/__init__.py) и одно имя
      # платформы из docs/site/site.json; у релизной версии есть раздел в CHANGELOG.
      - name: site and READMEs = release version
        run: python scripts/site-sync.py --check

  # Установщик и обёртка dozorcam на образе этого коммита: локальный реестр (pull по
  # digest), мок Telegram/GitHub, цикл install → backup → uninstall → restore → update →
  # автооткат с ломаным healthcheck → uninstall (tests/install/install-smoke.sh).
  install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/dozorcam scripts/release-assets.sh tests/install/install-smoke.sh
      - name: install.sh and dozorcam, end to end
        run: tests/install/install-smoke.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1
